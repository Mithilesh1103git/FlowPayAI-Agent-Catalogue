server {
  listen 7860;
  client_max_body_size 15m;
  location /api/ { proxy_pass http://127.0.0.1:8000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /paypal/ { proxy_pass http://127.0.0.1:8000/paypal/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /orders/ { proxy_pass http://127.0.0.1:8000/orders/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://127.0.0.1:8501; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400; }
}\n